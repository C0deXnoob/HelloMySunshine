<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch Party</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <!-- Identity Selection Modal -->
    <div id="identityModal" class="modal-overlay">
        <div class="modal-card">
            <h2>Who is joining?</h2>
            <div class="identity-buttons">
                <button class="btn btn-primary" onclick="selectIdentity('Your Bubu')">Your Bubu</button>
                <button class="btn btn-secondary" onclick="selectIdentity('Your Dudu')">Your Dudu</button>
            </div>
        </div>
    </div>

    <!-- Main Application Container -->
    <div id="app" class="hidden">
        
        <!-- Landing Page -->
        <div id="landing-page" class="card-container">
            <div class="card">
                <h3>Host a Movie</h3>
                <input type="text" id="hostRoomInput" placeholder="Enter Room Name">
                <button id="startMovieBtn" class="btn btn-primary">Start Broadcast</button>
            </div>

            <div class="card">
                <h3>Join a Movie</h3>
                <input type="text" id="joinRoomInput" placeholder="Enter Room Code">
                <button id="joinRoomBtn" class="btn btn-secondary">Join Room</button>
            </div>
        </div>

        <!-- Theater View -->
        <div id="theater-page" class="hidden">
            
            <header class="theater-header">
                <span id="roleBadge" class="badge"></span>
                <span class="badge badge-viewers">Viewers: <span id="viewerCount">0</span></span>
            </header>

            <div class="theater-layout">
                
                <!-- Video Screen (Fixed at Top for Mobile) -->
                <div class="player-container">
                    <div id="waitingState" class="waiting-placeholder">
                        <p>Waiting for host to share screen...</p>
                    </div>
                    <!-- Video tag with no controls attribute -->
                    <video id="theaterVideo" autoplay playsinline></video>
                </div>

                <!-- Chat Section (Stacked Directly Below Video on Mobile) -->
                <div id="chatSection" class="chat-container">
                    <div class="chat-header">Live Chat</div>
                    <div id="chatMessages" class="chat-messages"></div>
                    <form id="chatForm" class="chat-form">
                        <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
                        <button type="submit" class="btn btn-primary">Send</button>
                    </form>
                </div>

            </div>

            <!-- Footer Controls -->
            <footer class="controls-bar">
                <div id="hostControls" class="hidden">
                    <button id="shareScreenBtn" class="btn btn-primary">Start Sharing</button>
                    <button id="stopScreenBtn" class="btn btn-danger hidden">Stop Sharing</button>
                </div>
                <div id="viewerControls" class="hidden">
                    <span class="status-text">Live Sync Active</span>
                </div>
            </footer>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
