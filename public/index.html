<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello My Sunshine - Movie Broadcast</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <h2>Hello My Sunshine - Theater</h2>
        
        <div id="room-selection">
            <input type="text" id="roomInput" placeholder="Enter Room Name" />
            <button id="joinBtn">Enter Room</button>
        </div>

        <div id="stream-container" class="hidden">
            <div class="player-wrapper">
                <video id="remoteScreen" autoplay playsinline controls></video>
                <div id="waitingState" class="placeholder">
                    Waiting for PC to start screen share...
                </div>
            </div>

            <div class="controls">
                <button id="startBroadcastBtn" class="primary">Start Movie Stream (PC Only)</button>
                <button id="stopBroadcastBtn" class="hidden danger">Stop Stream</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
