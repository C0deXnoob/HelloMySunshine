<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch Party</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Jitsi External API -->
    <script src="https://meet.jit.si/external_api.js"></script>
</head>
<body>

    <!-- Identity Selection Modal -->
    <div id="identityModal" class="modal-overlay">
        <div class="modal-card">
            <h2>Who is joining?</h2>
            <div class="identity-buttons">
                <button id="btnBubu" class="btn btn-primary">Your Bubu</button>
                <button id="btnDudu" class="btn btn-secondary">Your Dudu</button>
            </div>
        </div>
    </div>

    <!-- Main Application Container -->
    <div id="app" class="hidden">
        
        <!-- Landing Page -->
        <div id="landing-page" class="card-container">
            <div class="card">
                <h3>Host a Movie</h3>
                <input type="text" id="hostRoomInput" placeholder="Enter Room Name">
                <button id="startMovieBtn" class="btn btn-primary">Start Broadcast</button>
            </div>

            <div class="card">
                <h3>Join a Movie</h3>
                <input type="text" id="joinRoomInput" placeholder="Enter Room Code">
                <button id="joinRoomBtn" class="btn btn-secondary">Join Room</button>
            </div>
        </div>

        <!-- Theater View -->
        <div id="theater-page" class="hidden">
            
            <header class="theater-header">
                <span id="roleBadge" class="badge"></span>
                <span class="badge badge-viewers">Viewers: <span id="viewerCount">0</span></span>
            </header>

            <div class="theater-layout">
                
                <!-- Video Screen Section (Jitsi Mount Point) -->
                <div class="player-container">
                    <div id="jitsi-container"></div>
                </div>

                <!-- Live Chat Section directly below screen on mobile -->
                <div id="chatSection" class="chat-container">
                    <div class="chat-header">Live Chat</div>
                    <div id="chatMessages" class="chat-messages"></div>
                    <form id="chatForm" class="chat-form">
                        <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
                        <button type="submit" class="btn btn-primary">Send</button>
                    </form>
                </div>

            </div>

            <footer class="controls-bar">
                <span class="status-text">Live Broadcast Sync Active</span>
            </footer>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
